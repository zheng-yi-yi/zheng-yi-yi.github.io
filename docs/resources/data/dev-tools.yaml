# 开发工具
- group: 在线调试
  items:
    - { name: Regex101, url: https://regex101.com, desc: 正则表达式在线测试与解释, tags: [正则, 免费] }
    - { name: JSON Crack, url: https://jsoncrack.com, desc: 把 JSON 可视化成节点图, tags: [json, 免费] }
    - { name: JSON Formatter, url: https://jsonformatter.org, desc: JSON 格式化、校验与压缩, tags: [json, 免费] }
    - { name: Crontab Guru, url: https://crontab.guru, desc: Cron 表达式解释与校验, tags: [cron, 免费] }
    - { name: jwt.io, url: https://jwt.io, desc: JWT 解码与签名校验, tags: [jwt, 免费] }
    - { name: Transform, url: https://transform.tools, desc: JSON 转 TS 类型、YAML、Go struct 等, tags: [转换, 免费] }
    - { name: CyberChef, url: https://gchq.github.io/CyberChef, desc: 编码、加解密、哈希的瑞士军刀, tags: [编码, 免费] }
    - { name: Diffchecker, url: https://www.diffchecker.com, desc: 在线文本对比, tags: [diff, 免费] }
    - { name: Hoppscotch, url: https://hoppscotch.io, desc: 开源在线 API 调试工具, tags: [api, 开源] }
    - { name: Webhook.site, url: https://webhook.site, desc: 临时接收并查看 Webhook 请求, tags: [调试, 免费] }
    - { name: Carbon, url: https://carbon.now.sh, desc: 把代码生成好看的截图, tags: [截图, 免费] }
- group: 文档与学习
